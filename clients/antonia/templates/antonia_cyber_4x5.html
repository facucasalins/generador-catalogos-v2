*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;position:relative;overflow:hidden;background:#ECE6DC;color:#1E1C1A;font-family:'Lexend',sans-serif;-webkit-font-smoothing:antialiased}
.product-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.box{position:absolute;z-index:10;left:50%;transform:translateX(-50%);text-align:center}
.lettering{display:block;margin:0 auto}
.prices{display:flex;align-items:flex-start;justify-content:center}
.antes-block .strike-wrap{margin-top:8px}
.col{text-align:center}
.lbl{font-weight:400;letter-spacing:.06em;line-height:1;text-transform:uppercase}
.strike-wrap{position:relative;display:inline-block;padding:0 4px}
.strike{font-weight:800;line-height:1}
.strike-wrap::before,.strike-wrap::after{content:"";position:absolute;left:-10px;right:-10px;top:50%;height:6px;margin-top:-3px;border-radius:6px;background:rgba(214,64,60,.9)}
.strike-wrap::before{transform:rotate(-14deg)}.strike-wrap::after{transform:rotate(14deg)}
.price{font-weight:800;letter-spacing:-.01em;line-height:1}
.sub{font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.vdiv{align-self:stretch;width:3px;border-radius:2px}
.cuotas-line{line-height:1}
.cuotas-line b{font-weight:800}
.urg{font-weight:800;letter-spacing:.12em;color:#D6403C;text-transform:uppercase}
.off{position:absolute;z-index:20;border-radius:50%;background:#D6403C;color:#FFF;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(12deg);box-shadow:0 8px 22px rgba(0,0,0,.18);border:3px solid #F4E5D5}
.off .pct{font-weight:800;line-height:.95;letter-spacing:-.02em}.off .txt{font-weight:800;letter-spacing:.14em}
.lettering{width:330px}
.prices{gap:38px;margin-top:18px}
.lbl{font-size:22px;margin-bottom:10px}.strike{font-size:46px}.price{font-size:62px}.sub{font-size:13px;margin-top:8px}
.cuotas-line{font-size:28px;margin-top:22px}
.urg{font-size:13px;margin-top:12px}
.box{top:32px;width:720px;padding:28px 40px 26px;background:rgba(30,28,26,.92);border-radius:28px;box-shadow:0 8px 24px rgba(0,0,0,.18);color:#F4E5D5}
.logo{height:104px;width:330px;margin:0 auto}
.evento{font-size:18px;font-weight:800;letter-spacing:.42em;padding-left:.42em;color:#E07A9E;margin-top:8px}
.vdiv{background:#F4E5D5;opacity:.7}.strike,.price{color:#FFF}
.strike-wrap::before,.strike-wrap::after{background:rgba(224,122,158,.95)}
.urg{color:#E07A9E}
.off{top:-14px;right:-34px;width:118px;height:118px;border-color:#1E1C1A;background:#E07A9E}.off .pct{font-size:40px}.off .txt{font-size:19px}
</style></head><body>
<img class="product-image" src="{imagen_b64}" alt="producto">
<span id="hs" style="display:none">{precio_hotsale_formateado}</span>
<div class="box">
  <div class="off"><div class="pct">50%</div><div class="txt">OFF</div></div>
  <div class="logo" role="img" aria-label="Antonia" style="-webkit-mask:url({logo_b64}) center/contain no-repeat;mask:url({logo_b64}) center/contain no-repeat;background:#FFF"></div>
  <div class="evento">CYBER</div>
  <div class="prices">
    <div class="col antes-block"><div class="lbl">Antes</div><div class="strike-wrap"><span class="strike">{precio_original_formateado}</span></div></div>
    <div class="vdiv"></div>
    <div class="col"><div class="lbl ahora">Ahora</div><div class="price">{precio_efectivo_formateado}</div><div class="sub">con transferencia</div></div>
  </div>
  <div class="cuotas-line cuotas"><span id="cn">6</span> cuotas sin interés de <b id="cv">{cuota_formateada}</b></div>
  <div class="urg">Solo por Cyber · Hasta agotar stock</div>
</div>
<script>
  function adjust(){
    var num=function(s){return parseFloat((s||'').replace(/[^0-9,]/g,'').replace(',','.'))||0;};
    var o=num(document.querySelector('.strike').textContent), hs=num(document.getElementById('hs').textContent);
    var off=document.querySelector('.off');
    if(o>0&&hs>0&&hs<o){var p=Math.round((1-hs/o)*100);off.querySelector('.pct').textContent=p+'%';if(p<5)off.style.display='none';}
    else{off.style.display='none';}
    if(hs>0){var nc=hs>130000?9:6;document.getElementById('cn').textContent=nc;
      document.getElementById('cv').textContent='$'+Math.round(hs/nc).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
    else{document.querySelector('.cuotas').style.display='none';}
    var strike=document.querySelector('.strike');
    var price=document.querySelector('.price');
    if(strike&&price){
      var n=function(s){return (s||'').replace(/\s+/g,'');};
      if(n(strike.textContent)===n(price.textContent)){
        document.querySelector('.antes-block').style.display='none';
        document.querySelector('.ahora').style.display='none';
        price.style.marginTop='40px';
      }
    }
  }
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(adjust);}else{window.addEventListener('load',adjust);}
  </script>
