<!-- META
nombre: halloween_cuotas_4x5
aspect_ratio: 4:5
width: 1080
height: 1350
descripcion: Placa Halloween Flint 4:5 - fondo amarillo con chorreado negro, telaraña, "TRICK OR TREAT", cuota protagonista. Desmarcar después del 31/10.
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Archivo:wght@400;600;700;800&display=swap');

  :root {
    --ink: #000000;
    --footer: #1D1D1B;
    --yellow: #F6B01D;
    --red: #E84542;
    --cream: #EFE8CE;
    --deal: #249C55;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
    background: var(--yellow);
    font-family: 'Archivo', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* CHORREADO superior */
  .drip {
    position: absolute;
    top: 0; left: 0;
    width: 1080px; height: 300px;
    fill: var(--footer);
    z-index: 2;
  }

  .logo {
    position: absolute;
    top: 34px; left: 44px;
    width: 170px;
    height: auto;
    z-index: 5;
  }

  .headline {
    position: absolute;
    top: 46px; right: 56px;
    text-align: right;
    font-family: 'Big Shoulders Display', Impact, sans-serif;
    font-weight: 900;
    text-transform: uppercase;
    color: var(--cream);
    z-index: 5;
  }
  .headline .big { font-size: 104px; line-height: .86; display: block; }
  .headline .small { font-size: 38px; color: var(--yellow); letter-spacing: 1px; display: block; margin-top: 6px; }

  /* TELARAÑA esquina */
  .web {
    position: absolute;
    right: -10px; top: 300px;
    width: 250px; height: 250px;
    stroke: var(--footer);
    stroke-width: 2.4;
    fill: none;
    opacity: .7;
    z-index: 1;
  }

  /* Araña colgando */
  .spider { position: absolute; left: 150px; top: 200px; z-index: 6; }
  .spider .thread { position: absolute; left: 23px; top: 0; width: 3px; height: 220px; background: var(--footer); }
  .spider svg { position: absolute; top: 210px; left: 0; width: 50px; fill: var(--footer); }

  /* Producto en sticker */
  .card {
    position: absolute;
    left: 50%;
    top: 300px;
    width: 700px;
    height: 576px;
    margin-left: -330px;
    border: 10px solid var(--ink);
    border-radius: 28px;
    box-shadow: 18px 18px 0 var(--ink);
    overflow: hidden;
    background: var(--cream);
    transform: rotate(2.5deg);
    z-index: 3;
  }
  .card img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; }

  .band {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 450px;
    background: var(--footer);
    clip-path: polygon(0 60px, 100% 0, 100% 100%, 0 100%);
    padding: 92px 56px 0;
    color: var(--cream);
    z-index: 2;
  }
  .label {
    font-family: 'Big Shoulders Display', Impact, sans-serif;
    font-weight: 800;
    font-size: 42px;
    line-height: 1;
    text-transform: uppercase;
    color: var(--yellow);
  }
  .cuota {
    font-family: 'Big Shoulders Display', Impact, sans-serif;
    font-weight: 900;
    font-size: 160px;
    line-height: .84;
    letter-spacing: -2px;
    margin: 22px 0 14px;
  }
  .title {
    font-family: 'Big Shoulders Display', Impact, sans-serif;
    font-weight: 800;
    font-size: 44px;
    line-height: 1.02;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 18px;
  }
  .row { display: flex; align-items: center; gap: 20px; }
  .total { font-size: 28px; font-weight: 600; }
  .total b { font-weight: 800; }
  .total s { opacity: .55; margin-left: 10px; font-size: 24px; text-decoration-thickness: 2px; }
  .pill {
    margin-left: auto;
    font-size: 26px;
    font-weight: 700;
    padding: 14px 24px;
    border-radius: 999px;
    background: var(--deal);
    color: #fff;
    white-space: nowrap;
  }
  .pill b { font-weight: 800; margin-left: 6px; }
</style>
</head>
<body>
  <svg class="drip" viewBox="0 0 1080 300" preserveAspectRatio="none">
    <path d="M0 0H1080V200C1060 200 1050 214 1050 236C1050 262 1022 262 1022 236V214C1022 196 990 196 990 214V262C990 296 950 296 950 262V214C950 200 900 196 880 212C866 224 860 214 860 204C860 190 820 190 820 206V236C820 252 798 252 798 236V214C798 196 740 196 720 214V280C720 300 690 300 690 280V222C690 204 640 200 620 214C606 226 600 214 600 206C600 192 560 192 556 210V244C556 264 530 264 530 244V214C530 198 470 196 450 212C436 224 430 212 430 204C430 192 390 190 386 210V268C386 292 352 292 352 268V218C352 202 300 198 280 212C268 222 262 212 262 204C262 192 222 192 220 210V238C220 256 196 256 196 238V214C196 200 150 198 130 212C116 222 110 212 110 204C110 192 70 192 66 210V254C66 276 36 276 36 254V214C36 202 18 198 0 202Z"/>
  </svg>

  <svg class="web" viewBox="0 0 100 100">
    <path d="M100 0L0 100M100 0L35 100M100 0L0 35M100 0L68 100M100 0L0 68"/>
    <path d="M100 22Q86 18 78 22Q80 10 78 0M100 44Q74 38 56 44Q62 22 56 0M100 66Q60 58 34 66Q44 34 34 0M100 88Q48 76 12 88Q26 44 12 0"/>
  </svg>

  <div class="spider">
    <div class="thread"></div>
    <svg viewBox="0 0 50 50"><ellipse cx="25" cy="30" rx="9" ry="11"/><circle cx="25" cy="16" r="6"/><path d="M16 26L2 18M16 30L0 30M16 34L2 44M18 38L8 50M34 26L48 18M34 30L50 30M34 34L48 44M32 38L42 50" stroke="#1D1D1B" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
  </div>

  <img class="logo" src="{logo_b64}" alt="Flint">

  <div class="headline"><span class="big">Trick or treat?</span><span class="small">Treat. Sin trucos.</span></div>

  <div class="card"><img src="{imagen_b64}" alt="producto"></div>

  <div class="band">
    <!-- CUOTA: cuota_formateada sobre hotsale (cuotas_sobre_promocional: true) -->
    <div class="label">{cuotas_num} cuotas sin interés de</div>
    <div class="cuota">{cuota_formateada}</div>
    <div class="title">{titulo_placa}</div>
    <div class="row">
      <div class="total">Total <b data-hot>{precio_hotsale_formateado}</b><s data-orig>{precio_original_formateado}</s></div>
      <!-- TRANSFERENCIA: precio_efectivo = hotsale x 0.90 -->
      <div class="pill" data-efe-wrap><span class="pct-efe">10</span>% OFF transf.<b data-efe>{precio_efectivo_formateado}</b></div>
    </div>
  </div>

  <script>
  function num(s) { return parseInt((s || '').replace(/[^0-9]/g, ''), 10) || 0; }
  function shrink(el, min) {
    if (!el) return;
    var s = parseFloat(getComputedStyle(el).fontSize), g = 0;
    while (el.scrollWidth > el.clientWidth + 1 && s > min && g < 200) { s -= 1; el.style.fontSize = s + 'px'; g++; }
  }
  function adjust() {
    var o = document.querySelector('[data-orig]');
    var h = document.querySelector('[data-hot]');
    var e = document.querySelector('[data-efe]');
    var vo = num(o && o.textContent), vh = num(h && h.textContent), ve = num(e && e.textContent);
    if (!(vo > vh)) { if (o) o.style.display = 'none'; }
    var pe = vh > 0 && ve > 0 ? Math.round((1 - ve / vh) * 100) : 0;
    if (pe < 1) { var w = document.querySelector('[data-efe-wrap]'); if (w) w.style.display = 'none'; }
    else document.querySelectorAll('.pct-efe').forEach(function (n) { n.textContent = pe; });
    shrink(document.querySelector('.title'), 34);
  }
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(adjust); } else { window.addEventListener('load', adjust); }
  </script>
</body>
</html>
