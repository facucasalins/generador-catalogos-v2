<!-- META
nombre: halloween_4x5
aspect_ratio: 4:5
width: 1080
height: 1350
descripcion: Placa Halloween Flint 4:5 - noche oscura, luna amarilla, producto en lápida sticker, "NO TRICKS. JUST POWER." Desmarcar después del 31/10.
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Archivo:wght@400;600;700;800&display=swap');

  :root {
    --ink: #000000;
    --footer: #1D1D1B;
    --night: #121010;
    --yellow: #F6B01D;
    --red: #E84542;
    --cream: #EFE8CE;
    --deal: #249C55;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse 620px 520px at 50% 58%, rgba(246,176,29,.20) 0%, rgba(246,176,29,0) 70%),
      var(--night);
    font-family: 'Archivo', system-ui, sans-serif;
    color: var(--cream);
    -webkit-font-smoothing: antialiased;
  }

  /* LUNA */
  .moon {
    position: absolute;
    top: -70px; right: -60px;
    width: 400px; height: 400px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 62%, rgba(0,0,0,.10) 0 34px, transparent 35px),
      radial-gradient(circle at 62% 74%, rgba(0,0,0,.08) 0 22px, transparent 23px),
      radial-gradient(circle at 45% 38%, rgba(0,0,0,.07) 0 16px, transparent 17px),
      var(--yellow);
    box-shadow: 0 0 120px rgba(246,176,29,.35);
  }

  .bat { position: absolute; fill: var(--footer); }
  .bat.light { fill: var(--cream); opacity: .9; }

  .logo {
    position: absolute;
    top: 38px; left: 44px;
    width: 172px;
    height: auto;
    z-index: 5;
  }

  .headline {
    position: absolute;
    top: 210px; left: 56px;
    font-family: 'Big Shoulders Display', Impact, sans-serif;
    font-weight: 900;
    font-size: 124px;
    line-height: .86;
    text-transform: uppercase;
    letter-spacing: .5px;
    z-index: 5;
  }
  .headline .y { color: var(--yellow); display: block; }

  /* LÁPIDA sticker: borde negro grueso + sombra dura, como el logo */
  .stone {
    position: absolute;
    left: 50%;
    top: 474px;
    width: 720px;
    height: 600px;
    margin-left: -360px;
    border-radius: 300px 300px 26px 26px;
    border: 10px solid var(--ink);
    box-shadow: 0 0 0 9px var(--yellow), 20px 20px 0 9px var(--red), 0 0 110px rgba(246,176,29,.30);
    overflow: hidden;
    background: var(--cream);
    transform: rotate(-3deg);
    z-index: 3;
  }
  .stone img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
  }
  .stone .tag {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: var(--ink);
    color: var(--cream);
    font-family: 'Big Shoulders Display', Impact, sans-serif;
    font-weight: 800;
    font-size: 42px;
    line-height: 1;
    text-transform: uppercase;
    text-align: center;
    padding: 16px 30px 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .info {
    position: absolute;
    left: 56px; right: 56px; bottom: 54px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    z-index: 4;
  }
  .strike {
    font-size: 30px;
    font-weight: 600;
    color: rgba(239,232,206,.6);
    text-decoration: line-through;
    text-decoration-thickness: 2px;
    margin-bottom: 12px;
  }
  .price {
    font-family: 'Big Shoulders Display', Impact, sans-serif;
    font-weight: 900;
    font-size: 138px;
    line-height: .82;
    color: var(--yellow);
    letter-spacing: -1px;
  }
  .pills { display: flex; flex-direction: column; gap: 12px; align-items: flex-end; }
  .pill {
    font-size: 26px;
    font-weight: 700;
    padding: 14px 24px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .pill b { font-weight: 800; margin-left: 6px; }
  .pill-deal { background: var(--deal); color: #fff; }
  .pill-cuotas { border: 3px solid var(--cream); color: var(--cream); }
</style>
</head>
<body>
  <div class="moon"></div>

  <!-- murciélagos (silueta genérica) -->
  <svg class="bat" style="top:96px; right:150px; width:150px; transform:rotate(-10deg)" viewBox="0 0 48 20"><path d="M0 10C6 4 12 4 16 8C18 4 20 2 22 4L24 0 26 4C28 2 30 4 32 8C36 4 42 4 48 10C42 10 38 14 36 18C32 14 28 14 26 18L24 16 22 18C20 14 16 14 12 18C10 14 6 10 0 10Z"/></svg>
  <svg class="bat" style="top:236px; right:60px; width:84px; transform:rotate(12deg)" viewBox="0 0 48 20"><path d="M0 10C6 4 12 4 16 8C18 4 20 2 22 4L24 0 26 4C28 2 30 4 32 8C36 4 42 4 48 10C42 10 38 14 36 18C32 14 28 14 26 18L24 16 22 18C20 14 16 14 12 18C10 14 6 10 0 10Z"/></svg>
  <svg class="bat light" style="top:520px; left:40px; width:96px; transform:rotate(-16deg)" viewBox="0 0 48 20"><path d="M0 10C6 4 12 4 16 8C18 4 20 2 22 4L24 0 26 4C28 2 30 4 32 8C36 4 42 4 48 10C42 10 38 14 36 18C32 14 28 14 26 18L24 16 22 18C20 14 16 14 12 18C10 14 6 10 0 10Z"/></svg>
  <svg class="bat light" style="top:470px; right:44px; width:64px; transform:rotate(14deg); opacity:.6" viewBox="0 0 48 20"><path d="M0 10C6 4 12 4 16 8C18 4 20 2 22 4L24 0 26 4C28 2 30 4 32 8C36 4 42 4 48 10C42 10 38 14 36 18C32 14 28 14 26 18L24 16 22 18C20 14 16 14 12 18C10 14 6 10 0 10Z"/></svg>

  <img class="logo" src="{logo_b64}" alt="Flint">

  <div class="headline">No tricks.<span class="y">Just power.</span></div>

  <div class="stone">
    <img src="{imagen_b64}" alt="producto">
    <div class="tag">{titulo_placa}</div>
  </div>

  <div class="info">
    <div>
      <div class="strike" data-orig>{precio_original_formateado}</div>
      <!-- PRECIO: hotsale = promocional TN -->
      <div class="price" data-hot>{precio_hotsale_formateado}</div>
    </div>
    <div class="pills">
      <!-- TRANSFERENCIA: precio_efectivo = hotsale x 0.90 -->
      <div class="pill pill-deal" data-efe-wrap><span class="pct-efe">10</span>% OFF transf.<b data-efe>{precio_efectivo_formateado}</b></div>
      <div class="pill pill-cuotas">{cuotas_num} cuotas s/interés<b>{cuota_formateada}</b></div>
    </div>
  </div>

  <script>
  function num(s) { return parseInt((s || '').replace(/[^0-9]/g, ''), 10) || 0; }
  function shrink(el, min) {
    if (!el) return;
    var s = parseFloat(getComputedStyle(el).fontSize), g = 0;
    while (el.scrollWidth > el.clientWidth + 1 && s > min && g < 200) { s -= 1; el.style.fontSize = s + 'px'; g++; }
  }
  function adjust() {
    var o = document.querySelector('[data-orig]');
    var h = document.querySelector('[data-hot]');
    var e = document.querySelector('[data-efe]');
    var vo = num(o && o.textContent), vh = num(h && h.textContent), ve = num(e && e.textContent);
    if (!(vo > vh)) { if (o) o.style.visibility = 'hidden'; }
    var pe = vh > 0 && ve > 0 ? Math.round((1 - ve / vh) * 100) : 0;
    if (pe < 1) { var w = document.querySelector('[data-efe-wrap]'); if (w) w.style.display = 'none'; }
    else document.querySelectorAll('.pct-efe').forEach(function (n) { n.textContent = pe; });
    shrink(document.querySelector('.stone .tag'), 30);
  }
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(adjust); } else { window.addEventListener('load', adjust); }
  </script>
</body>
</html>
