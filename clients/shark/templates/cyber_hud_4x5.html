    :root { --azul: #6fd6ff; --negro: #05080c; }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        width: 1080px; height: 1350px;
        font-family: 'Inter', sans-serif;
        position: relative; overflow: hidden;
        background: var(--negro); color: #fff;
        -webkit-font-smoothing: antialiased;
    }

    .product-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }

    .overlay-base {
        position: absolute; inset: 0; z-index: 2;
        background: linear-gradient(180deg,
            rgba(0,0,0,0.40) 0%, rgba(0,0,0,0.12) 22%, rgba(0,0,0,0.05) 42%,
            rgba(0,0,0,0.70) 66%, rgba(0,0,0,0.96) 82%, rgba(0,0,0,0.98) 100%);
    }

    /* Marco HUD: esquinas en L */
    .corner { position: absolute; width: 70px; height: 70px; z-index: 6; border-color: rgba(111,214,255,0.85); border-style: solid; border-width: 0; }
    .c-tl { top: 34px; left: 34px; border-top-width: 3px; border-left-width: 3px; }
    .c-tr { top: 34px; right: 34px; border-top-width: 3px; border-right-width: 3px; }
    .c-bl { bottom: 34px; left: 34px; border-bottom-width: 3px; border-left-width: 3px; }
    .c-br { bottom: 34px; right: 34px; border-bottom-width: 3px; border-right-width: 3px; }

    /* Etiqueta técnica arriba a la izquierda */
    .hud-label {
        position: absolute; top: 62px; left: 66px; z-index: 10;
        font-family: 'Chakra Petch', sans-serif; font-weight: 600; font-size: 18px; letter-spacing: 3px;
        color: var(--azul); text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        line-height: 1.5;
    }
    .hud-label .dim { color: rgba(255,255,255,0.65); }

    .header { position: absolute; top: 60px; right: 66px; z-index: 10; }
    .logo {
        height: 84px; width: auto; display: block;
        filter: brightness(0) invert(1) drop-shadow(0 2px 12px rgba(0,0,0,0.85)) drop-shadow(0 0 24px rgba(0,0,0,0.6));
    }

    .info-zone {
        position: absolute; bottom: 0; left: 0; right: 0;
        padding: 0 70px 70px; z-index: 10; text-align: center;
    }

    /* Chip de urgencia */
    .chip {
        display: inline-flex; align-items: center; gap: 10px;
        font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 3px;
        color: var(--negro); background: var(--azul);
        padding: 6px 16px; margin-bottom: 12px;
        clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
    }

    .evento {
        font-family: 'Chakra Petch', sans-serif; font-weight: 700;
        font-size: 76px; line-height: 1; letter-spacing: 6px;
        color: #fff; margin-bottom: 12px;
        text-shadow: 0 0 20px rgba(111,214,255,0.5), 0 4px 12px rgba(0,0,0,0.9);
    }
    .evento .acento { color: var(--azul); }

    .tachado {
        font-size: 36px; font-weight: 500; color: rgba(255,255,255,0.8);
        text-decoration: line-through; text-decoration-color: var(--azul); text-decoration-thickness: 2.5px;
        margin-bottom: 4px; text-shadow: 0 2px 12px rgba(0,0,0,0.9);
    }

    .precio-principal {
        font-size: 168px; font-weight: 900; line-height: 0.95; letter-spacing: -5px;
        margin-bottom: 14px;
        text-shadow: 0 4px 24px rgba(0,0,0,0.95), 0 0 60px rgba(0,0,0,0.7);
    }

    .condicion {
        font-size: 17px; font-weight: 700; letter-spacing: 2.2px;
        text-transform: uppercase; color: rgba(255,255,255,0.88);
        margin-bottom: 12px; text-shadow: 0 2px 12px rgba(0,0,0,0.9);
    }
    .condicion b { color: var(--azul); font-weight: 800; }
    .cupon {
        display: inline-block; margin-bottom: 24px;
        padding: 9px 26px; border: 2px solid var(--azul);
        color: var(--azul); background: rgba(0,0,0,0.6);
        font-family: 'Chakra Petch', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: 5px;
    }

    .divider { width: 60px; height: 3px; background: var(--azul); margin: 0 auto 20px; box-shadow: 0 0 12px rgba(111,214,255,0.7); }

    .nombre {
        font-size: 32px; font-weight: 700; line-height: 1.2; margin-bottom: 26px;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        text-shadow: 0 2px 16px rgba(0,0,0,0.95);
    }

    .pills { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
    .pill {
        display: inline-flex; align-items: center;
        font-size: 22px; font-weight: 800; letter-spacing: 2px; padding: 16px 30px;
        border: 2px solid var(--azul); color: var(--azul); background: rgba(0,0,0,0.5);
        text-transform: uppercase;
    }
    .pill-cuotas { background: var(--azul); color: var(--negro); clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); }
    .pill-cuotas .cuotas-mini { font-weight: 500; margin-left: 10px; opacity: 0.85; font-size: 18px; letter-spacing: 0.5px; text-transform: none; }
</style>
</head>

        <div class="precio-principal" data-calc="total" data-base="{precio_efectivo}">{precio_efectivo_formateado}</div>
        <div class="condicion">Promoción válida pagando con <b>transferencia bancaria</b> y con el cupón</div>
        <div class="cupon">CYBERSHARK</div>
        <div class="divider"></div>
        <div class="nombre">{titulo_placa}</div>
        <div class="pills">
            <div class="pill">Envío gratis</div>
            <div class="pill pill-cuotas">{cuotas_num} cuotas <span class="cuotas-mini">de <span data-calc="cuota" data-base="{precio_promocional}" data-cuotas="{cuotas_num}">{cuota_formateada}</span></span></div>
        </div>
    </div>
    <script>
        /* Descuento del código CYBERSHARK (20%), encadenado como en el checkout de Tiendanube. */
        (function () {
            var CUPON_FACTOR = 0.80;
            function fmt(v) { return '$' + String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
            function num(el, attr) { var v = parseFloat(el.getAttribute(attr)); return isFinite(v) && v > 0 ? v : null; }
            document.querySelectorAll('[data-calc]').forEach(function (el) {
                var base = num(el, 'data-base'); if (base === null) return;
                var cuotas = num(el, 'data-cuotas') || 1;
                el.textContent = fmt(base * CUPON_FACTOR / (el.getAttribute('data-calc') === 'cuota' ? cuotas : 1));
            });
        })();
    </script>
</body>
</html>
