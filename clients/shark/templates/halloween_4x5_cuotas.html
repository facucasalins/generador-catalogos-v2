    :root { --lima: #b6e04a; --violeta: #7a2a9c; --teal: #2c6e72; --negro: #0b0710; }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        width: 1080px; height: 1350px;
        font-family: 'Inter', sans-serif;
        position: relative; overflow: hidden;
        background: var(--negro); color: #fff;
        -webkit-font-smoothing: antialiased;
    }

    .product-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }

    /* Tinte de la pieza oficial: verde azulado arriba-derecha, violeta abajo-izquierda.
       mix-blend-mode: color tiñe sin aplastar la prenda (la remera negra sigue negra). */
    .tinte {
        position: absolute; inset: 0; z-index: 2; mix-blend-mode: color; opacity: 0.85;
        background:
            radial-gradient(ellipse 70% 55% at 90% 8%, var(--teal) 0%, rgba(44,110,114,0) 70%),
            radial-gradient(ellipse 80% 60% at 0% 75%, var(--violeta) 0%, rgba(122,42,156,0) 70%),
            radial-gradient(ellipse 60% 45% at 100% 65%, #5a2378 0%, rgba(90,35,120,0) 70%);
    }
    /* Brillo violeta suave en los bordes (luz, no color plano) */
    .glow-bordes {
        position: absolute; inset: 0; z-index: 3; mix-blend-mode: screen;
        background:
            radial-gradient(ellipse 42% 55% at 0% 62%, rgba(150,55,200,0.62), rgba(0,0,0,0) 72%),
            radial-gradient(ellipse 36% 50% at 100% 58%, rgba(130,45,180,0.50), rgba(0,0,0,0) 72%),
            radial-gradient(ellipse 50% 32% at 95% 0%, rgba(55,150,155,0.55), rgba(0,0,0,0) 72%),
            radial-gradient(ellipse 34% 26% at 0% 0%, rgba(55,150,155,0.35), rgba(0,0,0,0) 72%),
            radial-gradient(ellipse 70% 22% at 50% 100%, rgba(120,40,170,0.40), rgba(0,0,0,0) 72%);
    }

    .overlay-base {
        position: absolute; inset: 0; z-index: 4;
        background: linear-gradient(180deg,
            rgba(11,7,16,0.35) 0%, rgba(11,7,16,0.10) 22%, rgba(11,7,16,0.05) 40%,
            rgba(14,7,22,0.70) 64%, rgba(14,7,22,0.90) 80%, rgba(14,7,22,0.94) 100%);
    }

    /* Grano tipo póster */
    .grano {
        position: absolute; inset: 0; z-index: 5; opacity: 0.26; mix-blend-mode: overlay; pointer-events: none;
    }

    .header { position: absolute; top: 50px; right: 50px; z-index: 10; }
    .logo {
        height: 90px; width: auto; display: block;
        filter: brightness(0) invert(1) drop-shadow(0 2px 12px rgba(0,0,0,0.85)) drop-shadow(0 0 24px rgba(0,0,0,0.6));
    }

    /* Fecha arriba a la izquierda (en lugar de telaraña) */
    .fecha {
        position: absolute; top: 60px; left: 56px; z-index: 10;
        font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 22px; letter-spacing: 1px; line-height: 1.15;
        color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.85);
    }
    .fecha span { color: var(--lima); }

    .info-zone {
        position: absolute; bottom: 0; left: 0; right: 0;
        padding: 0 70px 62px; z-index: 10; text-align: center;
    }
    .titulo {
        font-family: 'Creepster', cursive; font-size: 78px; letter-spacing: 3px; line-height: 1;
        color: #fff; margin-bottom: 14px;
        text-shadow: 0 0 22px rgba(182,224,74,0.35), 0 4px 14px rgba(0,0,0,0.9);
    }

    .tachado {
        font-family: 'Creepster', cursive;
        font-size: 46px; letter-spacing: 2px; color: rgba(255,255,255,0.8);
        text-decoration: line-through; text-decoration-color: var(--lima); text-decoration-thickness: 3px;
        margin-bottom: 0; text-shadow: 0 2px 12px rgba(0,0,0,0.9);
    }

    .precio-principal {
        font-family: 'Creepster', cursive;
        font-size: 196px; line-height: 0.95; letter-spacing: 4px;
        color: var(--lima); margin-bottom: 18px;
        text-shadow: 0 0 40px rgba(182,224,74,0.5), 0 6px 22px rgba(0,0,0,0.9);
    }

    .cuotas-label {
        font-family: 'Creepster', cursive; font-size: 46px; letter-spacing: 2px; line-height: 1;
        color: #fff; margin-bottom: 0; text-shadow: 0 3px 12px rgba(0,0,0,0.9);
    }
    .total {
        font-size: 22px; font-weight: 700; letter-spacing: 1px; color: rgba(255,255,255,0.85);
        margin-bottom: 10px; text-shadow: 0 2px 12px rgba(0,0,0,0.9);
    }
    .total s { font-weight: 500; color: rgba(255,255,255,0.6); text-decoration-color: var(--lima); text-decoration-thickness: 2px; margin: 0 6px; }
    .total b { color: #fff; font-weight: 900; font-size: 26px; }

    .condicion {
        font-size: 17px; font-weight: 700; letter-spacing: 2.2px;
        text-transform: uppercase; color: rgba(255,255,255,0.9);
        margin-bottom: 8px; text-shadow: 0 2px 12px rgba(0,0,0,0.9);
    }
    .condicion b { color: var(--lima); font-weight: 800; }

    .codigo {
        font-family: 'Creepster', cursive; font-size: 44px; letter-spacing: 2px; line-height: 1.1;
        color: #fff; margin-bottom: 18px; text-shadow: 0 3px 12px rgba(0,0,0,0.9);
    }
    .codigo span { color: var(--lima); text-shadow: 0 0 16px rgba(182,224,74,0.5), 0 3px 12px rgba(0,0,0,0.9); }

    .nombre {
        font-size: 30px; font-weight: 700; line-height: 1.2; margin-bottom: 24px;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        text-shadow: 0 2px 16px rgba(0,0,0,0.95);
    }

    .pills { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
    .pill {
        display: inline-flex; align-items: center;
        font-size: 22px; font-weight: 800; letter-spacing: 2px; padding: 16px 30px;
        border: 2px solid var(--lima); color: var(--lima); background: rgba(0,0,0,0.5);
        border-radius: 3px; text-transform: uppercase;
    }
    .pill-cuotas { background: var(--lima); color: var(--negro); }
    .pill-cuotas .cuotas-mini { font-weight: 500; margin-left: 10px; opacity: 0.85; font-size: 18px; letter-spacing: 0.5px; text-transform: none; }
</style>
</head>
<body>

    <img class="product-image" src="{imagen_b64}" alt="producto">
    <div class="tinte"></div>
    <div class="glow-bordes"></div>
    <div class="overlay-base"></div>
    <svg class="grano" width="1080" height="1350">
        <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
        <rect width="100%" height="100%" filter="url(#n)"/>
    </svg>

    <div class="fecha">DEL 28/10<br><span>AL 31/10</span></div>
    <div class="header"><img class="logo" src="{logo_b64}" alt="logo"></div>

    <div class="info-zone">
        <div class="titulo">Descuentos Tétricos</div>
        <div class="cuotas-label">{cuotas_num} cuotas sin interés de</div>
        <div class="precio-principal" data-calc="cuota" data-base="{precio_promocional}" data-cuotas="{cuotas_num}">{cuota_formateada}</div>
        <div class="total">Precio total <s>{precio_hotsale_formateado}</s> <b data-calc="total" data-base="{precio_promocional}">{precio_hotsale_formateado}</b></div>
        <div class="codigo">Código: <span>HALLOWEEN</span></div>
        <div class="nombre">{titulo_placa}</div>
        <div class="pills">
            <div class="pill">Envío gratis</div>
            <div class="pill pill-cuotas">+20% OFF transferencia</div>
        </div>
    </div>
    <script>
        /* Descuento del código HALLOWEEN (20%), encadenado como en el checkout de Tiendanube. */
        (function () {
            var CUPON_FACTOR = 0.80;
            function fmt(v) { return '$' + String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
            function num(el, attr) { var v = parseFloat(el.getAttribute(attr)); return isFinite(v) && v > 0 ? v : null; }
            document.querySelectorAll('[data-calc]').forEach(function (el) {
                var base = num(el, 'data-base'); if (base === null) return;
                var cuotas = num(el, 'data-cuotas') || 1;
                el.textContent = fmt(base * CUPON_FACTOR / (el.getAttribute('data-calc') === 'cuota' ? cuotas : 1));
            });
        })();
    </script>
</body>
</html>
