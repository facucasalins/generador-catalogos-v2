  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1350px;position:relative;overflow:hidden;background:#ECE6DC;color:#1E1C1A;font-family:'MontserratE',sans-serif;-webkit-font-smoothing:antialiased}

  /* Imagen del producto: fondo full-bleed. Todo lo demas va ENCIMA */
  .product-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}

  /* Tarjeta: proporciones calcadas del arte original (1508x1666 -> 500px de ancho) */
  .card{position:absolute;top:40px;left:50%;transform:translateX(-50%) scale(.9);transform-origin:top center;z-index:10;
    width:500px;padding:36px 20px 36px;background:#F4E5D5;border:2.5px solid #1E1C1A;border-radius:30px;text-align:center}

  /* Lettering original "Cyber JUANITA" (PNG transparente). No reemplazar por fuentes. */
  .lettering{display:block;margin:0 auto;width:336px;height:auto}

  .lbl{font-size:42px;font-weight:400;letter-spacing:.02em;line-height:1;color:#1E1C1A;text-transform:uppercase}
  .antes{margin-top:34px}
  .strike-wrap{position:relative;display:inline-block;margin-top:14px;padding:0 6px}
  .strike{font-size:64px;font-weight:400;line-height:1;color:#1E1C1A;letter-spacing:-.01em}
  /* X roja sobre el precio original */
  .strike-wrap::before,.strike-wrap::after{content:"";position:absolute;left:-30px;right:-30px;top:50%;height:9px;margin-top:-4px;border-radius:9px;background:rgba(214,64,60,.85)}
  .strike-wrap::before{transform:rotate(-12deg)}
  .strike-wrap::after{transform:rotate(12deg)}

  .ahora{margin-top:28px}
  .price{font-size:80px;font-weight:800;letter-spacing:-.01em;line-height:1;color:#111;margin-top:20px}
  /* Sticker % OFF: rojo de la X, sobre la esquina sup. derecha de la tarjeta */
  .off{position:absolute;top:-34px;right:-58px;z-index:20;width:168px;height:168px;border-radius:50%;
    background:#D6403C;color:#FFF;display:flex;flex-direction:column;align-items:center;justify-content:center;
    transform:rotate(12deg);box-shadow:0 8px 22px rgba(0,0,0,.18);border:3px solid #F4E5D5}
  .off .pct{font-size:58px;font-weight:800;line-height:.95;letter-spacing:-.02em}
  .off .txt{font-size:28px;font-weight:800;letter-spacing:.14em;margin-top:2px}
  .sub{font-size:19px;font-weight:800;letter-spacing:.14em;color:#5E5850;text-transform:uppercase;margin-top:10px}
  /* Cuotas: pill oscura. Se calcula sobre precio CYBER (hotsale), no sobre transferencia */
  .cuotas{display:inline-block;margin-top:24px;padding:13px 20px;border-radius:999px;background:#1E1C1A;color:#F4E5D5;line-height:1;white-space:nowrap}
  .cuotas .n{font-size:20px;font-weight:800;letter-spacing:.01em}
  .cuotas .v{font-size:22px;font-weight:800;color:#FFF}
  .urg{margin-top:14px;font-size:15px;font-weight:800;letter-spacing:.12em;color:#D6403C;text-transform:uppercase}
</style>
</head>
<body>
  <img class="product-image" src="{imagen_b64}" alt="producto">

  <!-- OJO: precio_efectivo_formateado = precio promo (col G) x descuento_efectivo_factor (0.80 en pipeline.yaml de juanita). Es el precio CON el -20% de transferencia. NO reemplazar por precio_hotsale_formateado. -->
  <!-- OJO: el % se calcula con precio_hotsale (precio promo de TN, SIN transferencia) vs precio_original. Es el descuento real de tienda. -->
  <span id="hs" style="display:none">{precio_hotsale_formateado}</span>
  <!-- Regla cuotas Juanita Cyber: precio cyber > 130.000 => 9 cuotas, si no 6. Se muestra solo la mejor opcion. -->

    else{document.querySelector('.cuotas').style.display='none';}
    var strike=document.querySelector('.strike');
    var price=document.querySelector('.price');
    if(strike&&price){
      var n=function(s){return (s||'').replace(/\s+/g,'');};
      if(n(strike.textContent)===n(price.textContent)){
        document.querySelector('.antes-block').style.display='none';
        document.querySelector('.ahora').style.display='none';
        price.style.marginTop='40px';
      }
    }
  }
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(adjust);}else{window.addEventListener('load',adjust);}
  </script>
</body>
</html>
