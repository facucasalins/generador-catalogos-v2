<!-- META
nombre: cyber_4x5
aspect_ratio: 4:5
width: 1080
height: 1350
descripcion: Placa Cyber Mora 4:5 — neon cian/magenta, grilla tech, glitch
-->
<!-- PRICING: tachado = precio_hotsale_formateado | principal = precio_efectivo_formateado. NO cambiar. -->
<!-- NO usar "CyberMonday": marca registrada CACE, Mora no esta adherida. -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Archivo+Black&display=swap');

    :root {
        --bg: #070C26;
        --bg-deep: #03061A;
        --cyan: #22E4FF;
        --magenta: #FF2E88;
        --mora-red: #E63946;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        width: 1080px; height: 1350px;
        font-family: 'Archivo', sans-serif;
        position: relative; overflow: hidden;
        background:
            radial-gradient(60% 40% at 12% 8%, rgba(255,46,136,0.30) 0%, transparent 70%),
            radial-gradient(60% 40% at 92% 55%, rgba(34,228,255,0.22) 0%, transparent 70%),
            linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
    }
    .grid {
        position: absolute; left: -300px; right: -300px; top: 600px; height: 520px;
        background:
            repeating-linear-gradient(90deg, rgba(34,228,255,0.35) 0 2px, transparent 2px 72px),
            repeating-linear-gradient(0deg, rgba(34,228,255,0.35) 0 2px, transparent 2px 72px);
        transform: perspective(500px) rotateX(58deg);
        transform-origin: top center;
        -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 45%);
                mask-image: linear-gradient(180deg, transparent 0%, #000 45%);
        z-index: 0;
    }
    .scan {
        position: absolute; inset: 0; z-index: 1; pointer-events: none;
        background: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 5px);
    }

    .logo {
        position: absolute; top: 46px; left: 74px;
        width: 140px; height: auto; z-index: 6;
        filter: drop-shadow(0 0 14px rgba(34,228,255,0.45));
    }

    .wordmark { position: absolute; top: 40px; right: 74px; text-align: right; z-index: 6; }
    .wm-main {
        font-family: 'Archivo Black', sans-serif; font-size: 84px; line-height: 0.92; letter-spacing: 2px;
        color: #fff;
        text-shadow: -4px 0 0 var(--magenta), 4px 0 0 var(--cyan), 0 0 30px rgba(34,228,255,0.35);
    }
    .wm-sub {
        margin-top: 12px; display: inline-block;
        font-family: 'Archivo Black', sans-serif; font-size: 16px; letter-spacing: 4px;
        color: var(--bg-deep); background: var(--cyan);
        padding: 6px 12px;
    }

    .product-zone {
        position: absolute; top: 262px; left: 80px; right: 80px; height: 630px;
        border-radius: 16px; background: #FFFFFF;
        box-shadow: 0 0 0 4px var(--cyan), 0 0 26px 4px rgba(34,228,255,0.6), 0 0 70px 10px rgba(255,46,136,0.22);
        display: flex; align-items: center; justify-content: center;
        padding: 36px; z-index: 3; overflow: hidden;
    }
    .product-image { max-width: 100%; max-height: 100%; object-fit: contain; }

    .hud { position: absolute; width: 46px; height: 46px; border: 6px solid var(--magenta); z-index: 4; }
    .hud.tl { top: 244px; left: 62px; border-right: 0; border-bottom: 0; }
    .hud.tr { top: 244px; right: 62px; border-left: 0; border-bottom: 0; }
    .hud.bl { top: 864px; left: 62px; border-right: 0; border-top: 0; }
    .hud.br { top: 864px; right: 62px; border-left: 0; border-top: 0; }

    .titulo {
        position: absolute; top: 918px; left: 80px; right: 80px; height: 44px;
        font-family: 'Archivo Black', sans-serif; font-size: 36px; line-height: 44px;
        color: #fff; text-align: center;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        z-index: 4;
    }

    .price-band {
        position: absolute; top: 982px; left: 0; right: 0; height: 268px;
        background: linear-gradient(90deg, rgba(255,46,136,0.22) 0%, rgba(3,6,26,0) 45%, rgba(34,228,255,0.16) 100%), var(--bg-deep);
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 64px; color: #fff; z-index: 5;
    }
    .price-band::before {
        content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px;
        background: linear-gradient(90deg, var(--magenta), var(--cyan));
        box-shadow: 0 0 18px rgba(34,228,255,0.7);
    }
    .price-left { display: flex; flex-direction: column; align-items: flex-start; }
    .desde { font-family: 'Archivo Black', sans-serif; font-size: 30px; letter-spacing: 3px; color: var(--magenta); }
    .precio-tachado { font-size: 36px; font-weight: 700; text-decoration: line-through; opacity: 0.6; margin: 2px 0; }
    .precio-principal {
        font-family: 'Archivo Black', sans-serif; font-size: 128px; line-height: 0.92; letter-spacing: -3px;
        color: #fff;
        text-shadow: 0 0 22px rgba(34,228,255,0.5), 3px 3px 0 var(--magenta);
    }
    .price-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .sin-interes {
        background: var(--cyan); color: var(--bg-deep);
        font-family: 'Archivo Black', sans-serif; font-size: 15px; letter-spacing: 1.5px;
        padding: 6px 14px; border-radius: 3px; transform: rotate(5deg);
    }
    .cuotas-num { font-family: 'Archivo Black', sans-serif; font-size: 58px; line-height: 1; }
    .cuotas-monto { font-size: 28px; font-weight: 600; color: var(--cyan); }

    .bottom-banner {
        position: absolute; bottom: 0; left: 0; right: 0; height: 100px;
        background: #000; border-top: 2px solid rgba(34,228,255,0.35);
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 56px; color: #fff; z-index: 5;
    }
    .banner-left { display: flex; flex-direction: column; }
    .banner-legal { font-size: 18px; font-weight: 700; letter-spacing: 0.4px; }
    .banner-legal-small { font-size: 14px; margin-top: 2px; opacity: 0.85; }
    .banner-brand { font-family: 'Archivo Black', sans-serif; font-size: 34px; letter-spacing: 2px; }
    .banner-brand .x { color: var(--mora-red); }
</style>
</head>
<body>
    <div class="grid"></div>
    <div class="scan"></div>

    <img class="logo" src="{logo_b64}" alt="logo">

    <div class="wordmark">
        <div class="wm-main">CYBER<br>MORA</div>
        <div class="wm-sub">OFERTAS POR TIEMPO LIMITADO</div>
    </div>

    <div class="hud tl"></div><div class="hud tr"></div><div class="hud bl"></div><div class="hud br"></div>

    <div class="product-zone">
        <img class="product-image" src="{imagen_b64}" alt="producto">
    </div>

    <div class="titulo">{titulo_placa}</div>

    <div class="price-band">
        <div class="price-left">
            <div class="desde">DESDE</div>
            <div class="precio-tachado">{precio_hotsale_formateado}</div>
            <div class="precio-principal">{precio_efectivo_formateado}</div>
        </div>
        <div class="price-right">
            <div class="sin-interes">SIN INTERÉS</div>
            <div class="cuotas-num"><span>{cuotas_num}</span> CUOTAS</div>
            <div class="cuotas-monto">de <span>{cuota_formateada}</span></div>
        </div>
    </div>

    <div class="bottom-banner">
        <div class="banner-left">
            <div class="banner-legal">Precio final abonando en Efectivo.</div>
            <div class="banner-legal-small">Válido durante Cyber Mora.</div>
        </div>
        <div class="banner-brand"><span class="x">×</span> <span>{brand_name}</span></div>
    </div>

</body>
</html>
